name: cross-platform checks

# Both Windows and Linux installs ship from this branch, so every push is
# validated on both. A change that only compiles on one OS must fail here
# rather than on a user's machine.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Windows / py${{ matrix.python }}
    runs-on: [self-hosted, Windows, X64, local-windows]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: py -${{ matrix.python }} -m pip install --upgrade pip PyYAML

      - name: Syntax compile
        run: |
          py -${{ matrix.python }} -m py_compile install.py installer/prereqs.py scripts/voicebox_tts.py scripts/voicebox_bind.py scripts/voicebox_gpu.py scripts/hermes_voicebox_streamer.py

      - name: Installer unit tests
        run: py -${{ matrix.python }} -m unittest test_install.py -v

      - name: Bridge + GPU unit tests
        working-directory: scripts
        run: py -${{ matrix.python }} -m unittest test_voicebox_tts.py test_voicebox_gpu.py -v

      - name: Plugin storage tests
        run: node --test desktop-plugin/test_plugin_storage.mjs

      - name: Root-to-tip E2E
        run: py -${{ matrix.python }} scripts/test_e2e_root_to_tip.py

      - name: Verify both service templates are present
        shell: powershell
        run: |
          $required = @(
            'installer/systemd/voicebox-gpu-lifecycle.service',
            'installer/windows/voicebox-gpu-lifecycle.xml'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) { throw ('Missing service template(s): ' + ($missing -join ', ')) }
          Write-Host 'Both service templates present.'

  line-endings:
    name: line-ending hygiene
    runs-on: [self-hosted, Windows, X64, local-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Fail on CRLF in LF-only files
        shell: powershell
        run: |
          $bad = @(git grep -Il ([char]13) -- '*.sh' '*.py' '*.service' '*.yml' '*.yaml')
          if ($LASTEXITCODE -eq 0 -and $bad.Count -gt 0) {
            Write-Host 'CRLF found in LF-only files:'
            $bad
            throw 'Fix with: git add --renormalize .'
          }
          Write-Host 'Line endings OK.'

      - name: Fail if .gitattributes would renormalize the tree
        shell: powershell
        run: |
          git add --renormalize .
          if ($LASTEXITCODE -ne 0) { throw 'git add --renormalize failed' }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Files are not normalized per .gitattributes:'
            git diff --cached --stat
            throw 'Tree does not match .gitattributes.'
          }
          Write-Host 'Tree matches .gitattributes.'
